<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nando & Luna</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #000;
            color: #fff;
            padding: 20px;
            overflow: hidden;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 0px 15px rgba(255, 20, 147, 0.8);
            position: relative;
            z-index: 2;
        }
        .foto-principal {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid #ff3366;
            margin-bottom: 10px;
        }
        .foto-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .foto-container img {
            width: 120px;
            height: 120px;
            border-radius: 10px;
            border: 3px solid #ff3366;
        }
        .contador {
            font-size: 22px;
            font-weight: bold;
            margin: 10px 0;
            color: #ff3366;
        }
        h2 {
            font-size: 26px;
            color: #ff3366;
        }
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
    </style>
</head>
<body>
    <video class="background-video" autoplay loop muted>
        <source src="fundo.mp4" type="video/mp4">
        Seu navegador não suporta vídeos em HTML5.
    </video>
    <div class="container">
        <h2>Nosso Amor ❤️</h2>
        <img src="foto_principal.jpg" alt="Nossa foto" class="foto-principal">
        <p id="nomes">Nando & Luna</p>
        <p class="contador">Estamos juntos há <span id="contador"></span>! 🥰</p>
        <div class="foto-container">
            <img src="foto1.jpg" alt="Nosso amor">
            <img src="foto2.jpg" alt="Nosso amor">
            <img src="foto3.jpg" alt="Nosso amor">
            <img src="foto4.jpg" alt="Nosso amor">
            <img src="foto5.jpg" alt="Nosso amor">
            <img src="foto6.jpg" alt="Nosso amor">
            <img src="foto7.jpg" alt="Nosso amor">
            <img src="foto8.jpg" alt="Nosso amor">
            <img src="foto9.jpg" alt="Nosso amor">
            <img src="foto10.jpg" alt="Nosso amor">
            <img src="foto11.jpg" alt="Nosso amor">
        </div>
    </div>
    <script>
        // Defina a data do início do namoro
        const dataInicio = new Date('2023-10-14T00:00:00');
        function atualizarContador() {
            const agora = new Date();
            let anos = agora.getFullYear() - dataInicio.getFullYear();
            let meses = agora.getMonth() - dataInicio.getMonth();
            let dias = agora.getDate() - dataInicio.getDate();
            let horas = agora.getHours() - dataInicio.getHours();
            let minutos = agora.getMinutes() - dataInicio.getMinutes();
            let segundos = agora.getSeconds() - dataInicio.getSeconds();
            
            if (segundos < 0) { segundos += 60; minutos--; }
            if (minutos < 0) { minutos += 60; horas--; }
            if (horas < 0) { horas += 24; dias--; }
            if (dias < 0) {
                meses--;
                const ultimoMes = new Date(agora.getFullYear(), agora.getMonth(), 0).getDate();
                dias += ultimoMes;
            }
            if (meses < 0) { meses += 12; anos--; }
            
            document.getElementById('contador').textContent = `${anos} anos, ${meses} meses, ${dias} dias, ${horas}h ${minutos}m ${segundos}s`;
        }
        setInterval(atualizarContador, 1000);
        atualizarContador();
    </script>
</body>
</html>
